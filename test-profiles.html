<!DOCTYPE html>
<html lang="en">
<head>
    <title>Profile System Test</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="queue.css"/>
    <link rel="stylesheet" href="profiles.css"/>
    <style>
        body {
            padding: 20px;
            background: #333;
            color: white;
            font-family: Arial, sans-serif;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .profile-test {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #666;
            border-radius: 10px;
        }
        .test-queue {
            width: 512px;
            height: 384px;
            border: 2px solid #999;
            margin: 10px 0;
            transform: scale(0.5);
            transform-origin: top left;
        }
        button {
            margin: 5px;
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        .current-profile {
            font-weight: bold;
            color: #FFD700;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Profile System Test</h1>
        
        <div class="profile-test">
            <h2>Current Profile: <span id="currentProfile" class="current-profile">Loading...</span></h2>
            <p>Test different profiles by clicking the buttons below:</p>
            
            <div>
                <button onclick="testProfile('superhero')">Superhero</button>
                <button onclick="testProfile('minimal')">Minimal</button>
                <button onclick="testProfile('neon')">Neon</button>
                <button onclick="testProfile('retro')">Retro</button>
                <button onclick="testProfile('elegant')">Elegant</button>
            </div>
            
            <div class="test-queue" id="testQueue">
                <div class="song-container static">
                    <div class="song-position">1</div>
                    <div class="song-title">Test Song Title</div>
                    <div class="song-artist">Test Artist</div>
                    <div class="song-requester">Requested by TestUser</div>
                </div>
            </div>
            
            <div id="profileInfo">
                <h3>Profile Information</h3>
                <pre id="profileDetails"></pre>
            </div>
        </div>
    </div>

    <script src="lib/jquery-3.2.1.min.js"></script>
    <script src="profiles.js"></script>
    <script src="profile-config.js"></script>
    
    <script>
        function testProfile(profileName) {
            console.log(`Testing profile: ${profileName}`);
            applyProfile(profileName);
            updateProfileDisplay();
        }
        
        function updateProfileDisplay() {
            const current = getCurrentProfile();
            document.getElementById('currentProfile').textContent = current.name;
            document.getElementById('profileDetails').textContent = JSON.stringify(current, null, 2);
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Wait a bit for all scripts to load
            setTimeout(() => {
                if (typeof getCurrentProfile !== 'undefined') {
                    updateProfileDisplay();
                } else {
                    document.getElementById('currentProfile').textContent = 'Error: Profile system not loaded';
                }
            }, 500);
        });
    </script>
</body>
</html>
