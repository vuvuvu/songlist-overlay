<!DOCTYPE html>
<html>
<head>
    <title>Queue Debug - Simple Test</title>
    <script src="lib/jquery-3.2.1.min.js"></script>
</head>
<body>
    <h1>Queue API Debug</h1>
    <div id="results"></div>
    
    <script>
        const apiUrl = "https://api.streamersonglist.com/v1/";
        const streamerId = 287;
        const streamerName = "belleune";
        
        function log(message) {
            console.log(message);
            $('#results').append('<div>' + JSON.stringify(message) + '</div>');
        }
        
        function testAPI() {
            log('Testing Queue API...');
            
            // Test with streamerId (correct)
            const queueUrl = apiUrl + "streamers/" + streamerId + "/queue";
            log('Queue URL: ' + queueUrl);
            
            $.ajax({
                url: queueUrl,
                success: function(data) {
                    log('Queue API Success:');
                    log(data);
                    log('Queue length: ' + (data.list ? data.list.length : 'undefined'));
                },
                error: function(jqXHR, textStatus, errorThrown) {
                    log('Queue API Error:');
                    log({
                        status: jqXHR.status,
                        statusText: jqXHR.statusText,
                        responseText: jqXHR.responseText
                    });
                }
            });
            
            // Test streamer info
            const streamerUrl = apiUrl + "streamers/" + streamerId;
            log('Streamer URL: ' + streamerUrl);
            
            $.ajax({
                url: streamerUrl,
                success: function(data) {
                    log('Streamer API Success:');
                    log(data);
                },
                error: function(jqXHR, textStatus, errorThrown) {
                    log('Streamer API Error:');
                    log({
                        status: jqXHR.status,
                        statusText: jqXHR.statusText,
                        responseText: jqXHR.responseText
                    });
                }
            });
        }
        
        $(document).ready(function() {
            testAPI();
        });
    </script>
</body>
</html>
