<!DOCTYPE html>
<html lang="en">
<head>
    <title>Simple Overlay Test</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024, height=768">
    <link rel="stylesheet" href="queue.css"/>
    <link rel="stylesheet" href="profiles.css"/>
    <style>
        .debug-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
        }
        
        .debug-info.success {
            border: 2px solid #4CAF50;
        }
        
        .debug-info.error {
            border: 2px solid #f44336;
        }
    </style>
</head>
<body>
    <div id="queue-wrapper">
        <!-- Queue content will be dynamically inserted here -->
    </div>
    
    <div id="debugInfo" class="debug-info">
        Loading...
    </div>

    <script src="lib/jquery-3.2.1.min.js"></script>
    <script src="profiles.js"></script>
    <script src="profile-config.js"></script>
    
    <script>
        // Simplified configuration
        const apiUrl = "https://api.streamersonglist.com/v1/";
        const streamerName = "belleune";
        const streamerId = 287;
        const allCaps = true;
        
        let debugInfo = document.getElementById('debugInfo');
        
        function updateDebug(message, type = 'info') {
            debugInfo.textContent = message;
            debugInfo.className = `debug-info ${type}`;
            console.log(message);
        }
        
        function getRequesterName(song) {
            let requestedBy = 'Unknown';
            
            console.log('🔍 Detecting requester for song:', song.title);
            console.log('📋 Full song data:', song);
            
            // Check requests array with name field (CORRECT LOCATION)
            if (song.requests && Array.isArray(song.requests) && song.requests.length > 0) {
                const req = song.requests[0];
                console.log('✅ Found requests array, first item:', req);
                
                if (req.name) {
                    requestedBy = req.name;
                    console.log('🎯 Found requester name:', requestedBy);
                } else {
                    console.log('❌ No name field in request object');
                }
            } else {
                console.log('❌ No requests array found');
            }
            
            console.log('📤 Final requester result:', requestedBy);
            return requestedBy;
        }
        
        function createSongDiv(song, position, totalSongs) {
            const artist = allCaps ? song.artist.toUpperCase() : song.artist;
            const title = allCaps ? song.title.toUpperCase() : song.title;
            
            const requestedBy = getRequesterName(song);
            const displayRequestedBy = allCaps ? requestedBy.toUpperCase() : requestedBy;
            
            return `<div class="song-container static">
                <div class="song-position">POSITION ${position}/${totalSongs}</div>
                <div class="song-title">${title}</div>
                <div class="song-artist">BY ${artist}</div>
                <div class="song-requester">REQUESTED BY ${displayRequestedBy}</div>
            </div>`;
        }
        
        function loadQueue() {
            updateDebug('Fetching queue data...', 'info');
            
            const url = apiUrl + "streamers/" + streamerName + "/queue";
            
            $.ajax({
                url: url,
                method: 'GET',
                timeout: 10000,
                success: function(data) {
                    console.log('✅ API Response:', data);
                    updateDebug(`✅ Connected! ${data.list ? data.list.length : 0} songs`, 'success');
                    
                    displayQueue(data.list || []);
                },
                error: function(xhr, status, error) {
                    console.error('❌ API Error:', xhr, status, error);
                    updateDebug(`❌ Connection failed: ${error}`, 'error');
                    
                    // Show error message in queue
                    $("#queue-wrapper").html(`
                        <div class="song-container static">
                            <div class="song-position">ERROR</div>
                            <div class="song-title">CONNECTION FAILED</div>
                            <div class="song-artist">CHECK YOUR SETTINGS</div>
                            <div class="song-requester">STREAMER: ${streamerName}</div>
                        </div>
                    `);
                }
            });
        }
        
        function displayQueue(queueList) {
            $("#queue-wrapper").empty();
            
            if (queueList.length === 0) {
                $("#queue-wrapper").html(`
                    <div class="song-container static">
                        <div class="song-position">NO SONGS</div>
                        <div class="song-title">QUEUE IS EMPTY</div>
                        <div class="song-artist">ADD SONGS TO GET STARTED!</div>
                        <div class="song-requester">STREAMERSONGLIST.COM</div>
                    </div>
                `);
                return;
            }
            
            // Sort by position
            queueList.sort((a, b) => a.position - b.position);
            
            // Show first song
            const firstSong = queueList[0];
            const songDiv = createSongDiv(firstSong, 1, queueList.length);
            $("#queue-wrapper").html(songDiv);
            
            // Update debug with requester info
            if (firstSong.requests && firstSong.requests[0] && firstSong.requests[0].name) {
                updateDebug(`✅ Requester: ${firstSong.requests[0].name}`, 'success');
            } else {
                updateDebug('⚠️ No requester data found', 'error');
            }
        }
        
        // Initialize
        $(document).ready(function() {
            // Apply default profile
            if (typeof applyProfile !== 'undefined') {
                applyProfile('superhero');
            }
            
            // Load queue immediately
            loadQueue();
            
            // Refresh every 10 seconds
            setInterval(loadQueue, 10000);
        });
    </script>
</body>
</html>
