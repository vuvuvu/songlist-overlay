<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test - StreamerSongList</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #1a1a1a;
            color: #fff;
        }
        .test-section {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .response {
            background-color: #000;
            color: #0f0;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        .error {
            color: #ff6b6b;
        }
        .success {
            color: #51cf66;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>API Test - StreamerSongList</h1>
    
    <div class="test-section">
        <h3>Configuration:</h3>
        <p><strong>Streamer Name:</strong> belleune</p>
        <p><strong>Streamer ID:</strong> 287</p>
        <p><strong>API URL:</strong> https://api.streamersonglist.com/v1/</p>
    </div>
    
    <div class="test-section">
        <h3>API Tests:</h3>
        <button onclick="testQueueAPI()">Test Queue API</button>
        <button onclick="testStreamerAPI()">Test Streamer Info API</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>
    
    <div class="test-section">
        <h3>Results:</h3>
        <div id="results" class="response">Click a test button to see results...</div>
    </div>
    
    <script>
        const apiUrl = "https://api.streamersonglist.com/v1/";
        const streamerName = "belleune";
        const streamerId = 287;
        
        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : (type === 'success' ? 'success' : '');
            results.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            results.scrollTop = results.scrollHeight;
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = 'Results cleared...\n';
        }
        
        function testQueueAPI() {
            log('Testing Queue API...');
            
            const queueUrl = `${apiUrl}streamers/${streamerId}/queue`;
            log(`Making request to: ${queueUrl}`);
            
            $.ajax({
                url: queueUrl,
                method: 'GET',
                timeout: 10000,
                success: function(data) {
                    log('Queue API Response received!', 'success');
                    log('Raw Response:');
                    log(JSON.stringify(data, null, 2));
                    
                    if (data.list && Array.isArray(data.list)) {
                        log(`Found ${data.list.length} songs in queue`, 'success');
                        
                        if (data.list.length > 0) {
                            log('First song structure:');
                            log(JSON.stringify(data.list[0], null, 2));
                            
                            const firstSong = data.list[0];
                            log('Song fields analysis:');
                            log(`- title: "${firstSong.title}"`);
                            log(`- artist: "${firstSong.artist}"`);
                            log(`- song: "${firstSong.song}"`);
                            log(`- track: "${firstSong.track}"`);
                            log(`- name: "${firstSong.name}"`);
                            
                            // Check all properties
                            log('All properties in first song:');
                            Object.keys(firstSong).forEach(key => {
                                log(`- ${key}: ${JSON.stringify(firstSong[key])}`);
                            });
                        }
                    } else {
                        log('No list property found in response', 'error');
                    }
                },
                error: function(xhr, status, error) {
                    log(`Queue API Error: ${status} - ${error}`, 'error');
                    log(`Status Code: ${xhr.status}`);
                    log(`Response Text: ${xhr.responseText}`);
                }
            });
        }
        
        function testStreamerAPI() {
            log('Testing Streamer Info API...');
            
            const streamerUrl = `${apiUrl}streamers/${streamerId}`;
            log(`Making request to: ${streamerUrl}`);
            
            $.ajax({
                url: streamerUrl,
                method: 'GET',
                timeout: 10000,
                success: function(data) {
                    log('Streamer API Response received!', 'success');
                    log('Raw Response:');
                    log(JSON.stringify(data, null, 2));
                },
                error: function(xhr, status, error) {
                    log(`Streamer API Error: ${status} - ${error}`, 'error');
                    log(`Status Code: ${xhr.status}`);
                    log(`Response Text: ${xhr.responseText}`);
                }
            });
        }
        
        // Auto-run both tests on page load
        $(document).ready(function() {
            log('Page loaded, running automatic tests...');
            setTimeout(function() {
                testQueueAPI();
                setTimeout(testStreamerAPI, 2000);
            }, 1000);
        });
    </script>
</body>
</html>
