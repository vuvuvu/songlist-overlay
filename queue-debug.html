<!DOCTYPE html>
<html lang="en">
<head>
    <title>Queue Debug Version</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024, height=768">
    <link rel="stylesheet" href="queue.css"/>
    <link rel="stylesheet" href="profiles.css"/>
    <style>
        .debug-overlay {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 11px;
            max-width: 300px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 9999;
            border: 2px solid #4CAF50;
        }
        
        .debug-title {
            color: #FFD700;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .debug-line {
            margin: 2px 0;
        }
        
        .success { color: #4CAF50; }
        .error { color: #f44336; }
        .info { color: #2196F3; }
        .warning { color: #ff9800; }
    </style>
</head>
<body>
    <div class="debug-overlay">
        <div class="debug-title">🔍 Queue Debug</div>
        <div id="debugStatus">Loading...</div>
    </div>
    
    <div id="queue-wrapper">
        <!-- Queue content will be loaded here -->
    </div>

    <script src="lib/jquery-3.2.1.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="profiles.js"></script>
    <script src="profile-config.js"></script>
    
    <script>
        let debugStatus = document.getElementById('debugStatus');
        
        function debugLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            debugStatus.innerHTML += `<div class="debug-line ${type}">[${timestamp.slice(-8)}] ${message}</div>`;
            debugStatus.scrollTop = debugStatus.scrollHeight;
            console.log(`[DEBUG ${type.toUpperCase()}] ${message}`);
        }
        
        // Override console.log to capture all logs
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            debugLog(args.join(' '), 'info');
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            debugLog(args.join(' '), 'error');
        };
        
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            debugLog(args.join(' '), 'warning');
        };
        
        // Test if libraries are loaded
        debugLog('🔍 Checking library loading...', 'info');
        
        if (typeof $ === 'undefined') {
            debugLog('❌ jQuery not loaded!', 'error');
        } else {
            debugLog('✅ jQuery loaded', 'success');
        }
        
        if (typeof io === 'undefined') {
            debugLog('❌ Socket.IO not loaded!', 'error');
        } else {
            debugLog('✅ Socket.IO loaded', 'success');
        }
        
        if (typeof applyProfile === 'undefined') {
            debugLog('⚠️ Profiles not loaded', 'warning');
        } else {
            debugLog('✅ Profiles loaded', 'success');
        }
        
        // Load the main script with error handling
        debugLog('📜 Loading main script...', 'info');
        
        // Wrap the main script loading in try-catch
        try {
            // Load and execute the main streamersonglist.js content
            $.getScript('lib/streamersonglist.js')
                .done(function() {
                    debugLog('✅ Main script loaded successfully', 'success');
                })
                .fail(function(jqxhr, settings, exception) {
                    debugLog(`❌ Main script failed: ${exception}`, 'error');
                    debugLog(`Status: ${jqxhr.status}`, 'error');
                    debugLog(`Response: ${jqxhr.responseText}`, 'error');
                });
        } catch (error) {
            debugLog(`❌ Script loading error: ${error.message}`, 'error');
        }
        
        // Monitor for any uncaught errors
        window.addEventListener('error', function(event) {
            debugLog(`❌ JS Error: ${event.message}`, 'error');
            debugLog(`File: ${event.filename}:${event.lineno}`, 'error');
        });
        
        // Monitor for unhandled promise rejections
        window.addEventListener('unhandledrejection', function(event) {
            debugLog(`❌ Promise Error: ${event.reason}`, 'error');
        });
        
        debugLog('🚀 Debug overlay ready', 'success');
    </script>
</body>
</html>
