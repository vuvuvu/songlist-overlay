<!DOCTYPE html>
<html lang="en">
<head>
    <title>Profile Selector - StreamerSongList Overlay</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .profile-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }
        
        .profile-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .profile-card.active {
            border: 2px solid #4CAF50;
            background: rgba(76, 175, 80, 0.2);
        }
        
        .profile-card.active::after {
            content: "✓ ACTIVE";
            position: absolute;
            top: 10px;
            right: 10px;
            background: #4CAF50;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .profile-name {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #FFD700;
        }
        
        .profile-description {
            margin-bottom: 15px;
            opacity: 0.9;
            line-height: 1.4;
        }
        
        .profile-features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.9em;
        }
        
        .feature-group {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
        }
        
        .feature-title {
            font-weight: bold;
            margin-bottom: 5px;
            color: #FFD700;
        }
        
        .feature-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .feature-list li {
            padding: 2px 0;
            opacity: 0.8;
        }
        
        .feature-list li.enabled {
            color: #4CAF50;
        }
        
        .feature-list li.disabled {
            color: #f44336;
            text-decoration: line-through;
        }
        
        .controls {
            text-align: center;
            margin-top: 30px;
        }
        
        .btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn.secondary {
            background: linear-gradient(45deg, #2196F3, #1976D2);
        }
        
        .preview-frame {
            width: 100%;
            height: 400px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.5);
        }
        
        .status {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
        }
        
        .status.success {
            background: rgba(76, 175, 80, 0.3);
            border: 1px solid #4CAF50;
        }
        
        .status.error {
            background: rgba(244, 67, 54, 0.3);
            border: 1px solid #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 StreamerSongList Profile Selector</h1>
        
        <div class="profile-grid" id="profileGrid">
            <!-- Profiles will be dynamically loaded here -->
        </div>
        
        <div class="controls">
            <button class="btn" onclick="applySelectedProfile()">Apply Selected Profile</button>
            <a href="queue.html" class="btn secondary" target="_blank">Preview Overlay</a>
            <button class="btn secondary" onclick="resetToDefault()">Reset to Default</button>
        </div>
        
        <div class="status" id="status" style="display: none;"></div>
        
        <iframe class="preview-frame" id="previewFrame" src="queue.html" style="display: none;"></iframe>
    </div>

    <script src="lib/jquery-3.2.1.min.js"></script>
    <script src="profiles.js"></script>
    <script>
        let selectedProfile = 'superhero';
        
        // Load and display all profiles
        function loadProfiles() {
            const profiles = getAllProfiles();
            const grid = document.getElementById('profileGrid');
            
            grid.innerHTML = '';
            
            Object.keys(profiles).forEach(profileName => {
                const profile = profiles[profileName];
                const card = createProfileCard(profileName, profile);
                grid.appendChild(card);
            });
            
            // Mark current profile as active
            updateActiveProfile();
        }
        
        function createProfileCard(profileName, profile) {
            const card = document.createElement('div');
            card.className = 'profile-card';
            card.dataset.profile = profileName;
            card.onclick = () => selectProfile(profileName);
            
            const effects = profile.effects;
            const layout = profile.layout;
            const background = profile.background;
            
            card.innerHTML = `
                <div class="profile-name">${profile.name}</div>
                <div class="profile-description">${profile.description}</div>
                <div class="profile-features">
                    <div class="feature-group">
                        <div class="feature-title">Effects</div>
                        <ul class="feature-list">
                            <li class="${effects.animations ? 'enabled' : 'disabled'}">Animations</li>
                            <li class="${effects.flipBoard ? 'enabled' : 'disabled'}">Flip Board</li>
                            <li class="${effects.glow ? 'enabled' : 'disabled'}">Glow Effects</li>
                            <li class="${effects.bounce ? 'enabled' : 'disabled'}">Bounce</li>
                            <li class="${effects.pulse ? 'enabled' : 'disabled'}">Pulse</li>
                            <li class="${effects.shimmer ? 'enabled' : 'disabled'}">Shimmer</li>
                        </ul>
                    </div>
                    <div class="feature-group">
                        <div class="feature-title">Visual</div>
                        <ul class="feature-list">
                            <li class="${layout.borders ? 'enabled' : 'disabled'}">Borders</li>
                            <li class="${layout.shadows ? 'enabled' : 'disabled'}">Shadows</li>
                            <li class="${background.gradients ? 'enabled' : 'disabled'}">Gradients</li>
                            <li class="${background.patterns ? 'enabled' : 'disabled'}">Patterns</li>
                            <li class="${background.animation ? 'enabled' : 'disabled'}">BG Animation</li>
                        </ul>
                    </div>
                </div>
            `;
            
            return card;
        }
        
        function selectProfile(profileName) {
            selectedProfile = profileName;
            updateActiveProfile();
            showStatus(`Selected profile: ${getAllProfiles()[profileName].name}`, 'success');
        }
        
        function updateActiveProfile() {
            document.querySelectorAll('.profile-card').forEach(card => {
                card.classList.remove('active');
            });
            
            const activeCard = document.querySelector(`[data-profile="${selectedProfile}"]`);
            if (activeCard) {
                activeCard.classList.add('active');
            }
        }
        
        function applySelectedProfile() {
            try {
                // Apply the profile
                applyProfile(selectedProfile);
                
                // Save to localStorage for persistence
                localStorage.setItem('selectedProfile', selectedProfile);
                
                showStatus(`Profile "${getAllProfiles()[selectedProfile].name}" applied successfully!`, 'success');
                
                // Refresh preview if visible
                const previewFrame = document.getElementById('previewFrame');
                if (previewFrame.style.display !== 'none') {
                    previewFrame.src = previewFrame.src;
                }
                
            } catch (error) {
                console.error('Error applying profile:', error);
                showStatus(`Error applying profile: ${error.message}`, 'error');
            }
        }
        
        function resetToDefault() {
            selectedProfile = 'superhero';
            applySelectedProfile();
            updateActiveProfile();
        }
        
        function showStatus(message, type = 'success') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
            
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }
        
        function togglePreview() {
            const previewFrame = document.getElementById('previewFrame');
            if (previewFrame.style.display === 'none') {
                previewFrame.style.display = 'block';
                previewFrame.src = 'queue.html';
            } else {
                previewFrame.style.display = 'none';
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Load saved profile
            const savedProfile = localStorage.getItem('selectedProfile');
            if (savedProfile && getAllProfiles()[savedProfile]) {
                selectedProfile = savedProfile;
                applyProfile(selectedProfile);
            }
            
            loadProfiles();
        });
        
        // Add keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                applySelectedProfile();
            } else if (e.key === 'Escape') {
                resetToDefault();
            } else if (e.key >= '1' && e.key <= '5') {
                const profileNames = Object.keys(getAllProfiles());
                const index = parseInt(e.key) - 1;
                if (profileNames[index]) {
                    selectProfile(profileNames[index]);
                }
            }
        });
    </script>
</body>
</html>
